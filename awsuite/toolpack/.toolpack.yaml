id: awsuite
name: awsuite — Google Workspace for agents
version: 0.1.1
description: >-
  Gmail, Drive, Calendar, Docs, Sheets and the Admin Directory as suite_* tools.
  Read tools run directly; every write tool (send, draft, create, append, upload)
  returns a dry-run preview unless called with confirm=true. Credentials come
  from an awsuite profile (`awsuite auth login`) or a platform-supplied access
  token (AWSUITE_ACCESS_TOKEN / AWSUITE_TOKEN_CMD). Needs `pip install awsuite`.
category: tool_packs
tier: free
author: Aitherium
icon: briefcase
tags: [google, workspace, gmail, drive, calendar, docs, sheets, productivity, free]

# Every tool is generated from awsuite's one tool table; the pattern owns them all.
mcp_tools:
  - "suite_*"

# Importable when awsuite is pip-installed; otherwise the loader file-loads this
# directory's __init__.py, which imports the installed package.
tool_modules:
  - awsuite.toolpack

entitlements: []

skills:
  - suite-inbox-triage
  - suite-meeting-prep
  - suite-drive-to-workspace
  - suite-weekly-digest

persona_fragments:
  - "You can use the user's Google Workspace with the suite_* tools: suite_mail_search / suite_mail_read for Gmail, suite_drive_search / suite_drive_read for Drive, suite_calendar_events for the calendar, suite_docs_read and suite_sheets_read for documents. Write tools (suite_mail_send, suite_mail_draft, suite_calendar_create, suite_docs_append, suite_sheets_append, suite_drive_upload) return a preview unless confirm=true; show the preview and confirm only after the user agrees. A ScopeError names the scope the user must grant."
